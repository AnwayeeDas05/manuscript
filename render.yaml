services:
  - type: web
    name: inkspector-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inkspector-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false          # You'll set this manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TEMPERATURE
        value: "0.1"
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: MAX_CONTEXT_CHARS
        value: "8000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # You'll set this to your Vercel URL after deploying frontend

databases:
  - name: inkspector-db
    plan: free
    databaseName: inkspector
    user: inkspector_user
